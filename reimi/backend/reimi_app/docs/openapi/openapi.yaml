        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/rainbow-likes/users/received:
    get:
      tags:
      - RainbowLike
      summary: 自分がレインボーいいねされたユーザー一覧取得
      description: 自分がレインボーいいねされたユーザの一覧を取得できるAPI
      operationId: getRainbowLikeReceivedUsers
      responses:
        "200":
          description: 自分がレインボーいいねされたユーザーの一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetRainbowLikedUserListResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
