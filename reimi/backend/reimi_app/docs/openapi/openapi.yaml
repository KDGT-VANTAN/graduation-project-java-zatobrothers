        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: メッセージの一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetMessageListResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "403":
          description: 権限エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ACCESS_DENIED
                message: この操作を行う権限がありません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: チャットルームが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
    post:
      tags:
      - ChatRoom
      summary: チャットルームにメッセージ送信
      description: マッチング成立後に作成されるチャットルームにメッセージを送信できるAPI
      operationId: sendTextMessage
      parameters:
      - name: chatRoomId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "201":
          description: メッセージ送信が成功
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INVALID_REQUEST
                message: メッセージは必須です
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "403":
          description: 権限エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ACCESS_DENIED
                message: この操作を行う権限がありません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: チャットルームが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/users/me:
    get:
      tags:
      - User
      summary: ユーザー取得
