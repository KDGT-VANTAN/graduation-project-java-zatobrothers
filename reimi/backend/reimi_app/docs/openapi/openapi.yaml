openapi: 3.1.0
info:
  title: Reimi
  description: 天気で繋がる、出会いのアプリ
  version: "1.0"
servers:
- url: http://localhost:8080
  description: ローカルサーバー
security:
- bearerAuth: []
tags:
- name: Match
  description: マッチング関連のAPI
- name: UserProfile
  description: プロフィール関連のAPI
- name: Like
  description: いいね関連のAPI
- name: ChatRoom
  description: チャットルーム関連のAPI
- name: RainbowLike
  description: レインボーいいね関連のAPI
- name: WeatherPersonality
  description: ウェザーパーソナリティ診断関連のAPI
- name: User
  description: ユーザー関連のAPI
paths:
  /api/v1/users/{userId}/profile:
    get:
      tags:
      - UserProfile
      summary: ユーザープロフィール取得
      description: ユーザーのプロフィール詳細を取得できるAPI
      operationId: getProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: ユーザープロフィール取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithProfileResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
    put:
      tags:
      - UserProfile
      summary: ユーザープロフィール編集
      description: ユーザーのプロフィール編集API
      operationId: editProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "204":
          description: ユーザープロフィールが更新されました
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                フォーマット不正:
                  description: リクエスト形式が正しくない場合
                  value:
                    code: INVALID_REQUEST
                    message: 無効なリクエストです
                バリデーションエラー:
                  description: 入力値のバリデーションに失敗した場合
                  value:
                    code: INVALID_REQUEST
                    message: 入力値が不正です
                    details:
                      email: メールアドレスの形式が不正です
                      introduction: 自己紹介文は20文字以上500文字以下で入力してください
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "403":
          description: 権限エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: ACCESS_DENIED
                message: この操作を行う権限がありません
        "413":
          description: ファイルアップロードサイズ超過エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: PAYLOAD_TOO_LARGE
                message: アップロード可能なファイルサイズを超えています
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/users:
    get:
      tags:
      - User
      summary: ユーザー一覧取得
      description: 登録されているユーザーの一覧を取得できるAPI
      operationId: getUsers
      responses:
        "200":
          description: ユーザーの一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetUserListResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
    post:
      tags:
      - User
      summary: ユーザー新規登録
      description: ユーザーの新規登録実行時のAPI
      operationId: registerUser
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
        required: true
      responses:
        "201":
          description: ユーザーの新規登録が完了しました
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                フォーマット不正:
                  description: リクエスト形式が正しくない場合
                  value:
                    code: INVALID_REQUEST
                    message: 無効なリクエストです
                バリデーションエラー:
                  description: 入力値のバリデーションに失敗した場合
                  value:
                    code: INVALID_REQUEST
                    message: 入力値が不正です
                    details:
                      email: メールアドレスの形式が不正です
                      introduction: 自己紹介文は20文字以上500文字以下で入力してください
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "409":
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                ユーザー重複:
                  description: 既に登録されているユーザーで新規登録をした場合
                  value:
                    code: USER_ALREADY_EXISTS
                    message: 既に登録済みのユーザーです
                メール重複:
                  description: 既に登録されているメールアドレスで新規登録をした場合
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: 既に使用されているメールアドレスです
        "413":
          description: ファイルアップロードサイズ超過エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: PAYLOAD_TOO_LARGE
                message: アップロード可能なファイルサイズを超えています
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/users/device-tokens:
    post:
      tags:
      - User
      summary: ユーザーデバイストークン登録
      description: ユーザーがデバイストークンを登録（再割り当て）できるAPI
      operationId: registerDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenRequest"
        required: true
      responses:
        "200":
          description: ユーザーのデバイストークン登録が完了しました
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                フォーマット不正:
                  description: リクエスト形式が正しくない場合
                  value:
                    code: INVALID_REQUEST
                    message: 無効なリクエストです
                バリデーションエラー:
                  description: 入力値のバリデーションに失敗した場合
                  value:
                    code: INVALID_REQUEST
                    message: 入力値が不正です
                    details:
                      email: メールアドレスの形式が不正です
                      introduction: 自己紹介文は20文字以上500文字以下で入力してください
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/user-weather-personality-type:
    get:
      tags:
      - WeatherPersonality
      summary: ウェザーパーソナリティ診断結果表示
      description: ユーザーのウェザーパーソナリティタイプの診断結果をレスポンスするAPI
      operationId: getResult
      responses:
        "200":
          description: ユーザーのウェザーパーソナリティ診断結果の取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnoseResultWeatherPersonalityResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ウェザーパーソナリティ診断結果が見つかりません
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
    post:
      tags:
      - WeatherPersonality
      summary: ウェザーパーソナリティ診断結果スコアリング
      description: ユーザーのウェザーパーソナリティタイプの診断結果をスコアリングして保存するAPI
      operationId: diagnose
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnoseWeatherPersonalityRequest"
        required: true
      responses:
        "201":
          description: ユーザーのウェザーパーソナリティ診断が正常に行われました
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                フォーマット不正:
                  description: リクエスト形式が正しくない場合
                  value:
                    code: INVALID_REQUEST
                    message: 無効なリクエストです
                バリデーションエラー:
                  description: 入力値のバリデーションに失敗した場合
                  value:
                    code: INVALID_REQUEST
                    message: 入力値が不正です
                    details:
                      q1Answer: Q1の回答は必須です
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "409":
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: DIAGNOSE_RESUlT_ALREADY_EXISTS
                message: 既に診断済みです
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/rainbow-likes/{userId}:
    post:
      tags:
      - RainbowLike
      summary: ユーザーレインボーいいね
      description: ユーザーにレインボーいいねを送れるAPI。ユーザー双方がレインボーいいねを送信した場合のみマッチングが成立する。
      operationId: rainbowLike
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRainbowLikeRequest"
        required: true
      responses:
        "201":
          description: レインボーいいね送信が成功
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INVALID_REQUEST
                message: ユーザー自身にはレインボーいいねできません
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "409":
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                レインボーいいね重複:
                  description: 既にレインボーいいねを送信している場合
                  value:
                    code: RAINBOW_LIKE_ALREADY_SENT
                    message: 既にレインボーいいねを送信しています
                マッチング重複:
                  description: 既にマッチングが成立している場合
                  value:
                    code: MATCH_ALREADY_EXISTS
                    message: 既にマッチングが成立しています
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/likes/{userId}:
    post:
      tags:
      - Like
      summary: ユーザーいいね
      description: ユーザーにいいねを送れるAPI。ユーザー双方がいいねを送信した場合のみマッチングが成立する。
      operationId: like
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "201":
          description: いいね送信が成功
          content:
            application/json: {}
        "400":
          description: 無効なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INVALID_REQUEST
                message: ユーザー自身にはいいねできません
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: 認証されていません
        "404":
          description: リソース不存在エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: RESOURCE_NOT_FOUND
                message: ユーザーが見つかりません
        "409":
          description: 重複エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                いいね重複:
                  description: 既にいいねを送信している場合
                  value:
                    code: LIKE_ALREADY_SENT
                    message: 既にいいねを送信しています
                マッチング重複:
                  description: 既にマッチングが成立している場合
                  value:
                    code: MATCH_ALREADY_EXISTS
                    message: 既にマッチングが成立しています
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: 予期しないエラーが発生しました
  /api/v1/chat-rooms/{chatRoomId}/messages:
    get:
      tags:
      - ChatRoom
      summary: チャットルームのメッセージ一覧取得
      description: チャットルームに送信されたメッセージの一覧を取得できるAPI
      operationId: getChatRoomMessages
      parameters:
